name: Something isn't working
description: Tell us about a problem
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened?, description: What did you do, and what went wrong? }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: What did you expect to happen? }
  - type: input
    id: device
    attributes: { label: Device and browser / computer, placeholder: "e.g. Windows 11 laptop, iPhone 14 Safari" }
  - type: textarea
    id: shots
    attributes: { label: Screenshots, description: Drag images here if you can. }
