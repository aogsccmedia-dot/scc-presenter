name: Test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test test/*.test.js
      - name: Check every JavaScript file parses
        run: for f in $(git ls-files '*.js' '*.mjs' '*.cjs'); do node --check "$f" || exit 1; done
