name: Release
# Bump "version" in package.json and push to main: this builds the Windows installer and the Mac app,
# installs and opens both on real machines, and only then publishes release v<version>.
on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:
permissions:
  contents: write
concurrency: release
jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      skip: ${{ steps.v.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test test/*.test.js
      - id: v
        name: Is this version new?
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "${{ github.repository }}" --json isDraft --jq '.isDraft' 2>/dev/null | grep -qx false; then echo "skip=true" >> "$GITHUB_OUTPUT"; echo "$TAG already published"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi

  draft:
    needs: test
    if: needs.test.outputs.skip != 'true'
    runs-on: ubuntu-latest
    env: { TAG: "${{ needs.test.outputs.tag }}" }
    steps:
      - uses: actions/checkout@v4
      - name: Create draft release
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then echo "Release exists"; exit 0; fi
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "SCC Presenter ${TAG#v} (Beta)" --notes-file RELEASE_NOTES.md

  build:
    needs: [test, draft]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env: { TAG: "${{ needs.test.outputs.tag }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: node --test test/*.test.js
      - name: Build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --publish never

      # Install the real installer and open the app before anything is published.
      - name: Install and open (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env: { SCC_SMOKE_LOG: "${{ runner.temp }}\\smoke.log" }
        run: |
          $p = Start-Process -FilePath "dist\SCC-Presenter-Setup.exe" -ArgumentList "/S" -Wait -PassThru
          Write-Host "::notice::Installer exit code $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { Write-Host "::error::Installer exited with $($p.ExitCode)"; exit 1 }
          Start-Sleep -Seconds 3
          Get-Process | Where-Object { $_.ProcessName -like "SCC*" } | Stop-Process -Force -ErrorAction SilentlyContinue
          $exe = (Get-ChildItem -Path "$env:LOCALAPPDATA\Programs" -Recurse -Filter "SCC Presenter.exe" -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          if (-not $exe) { Write-Host "::error::Installed app not found under $env:LOCALAPPDATA\Programs"; Get-ChildItem "$env:LOCALAPPDATA\Programs" | ForEach-Object { Write-Host "::error::found $($_.Name)" }; exit 1 }
          Write-Host "::notice::Installed at $exe"
          $run = Start-Process -FilePath $exe -ArgumentList "--smoke-test" -Wait -PassThru
          $log = if (Test-Path $env:SCC_SMOKE_LOG) { (Get-Content $env:SCC_SMOKE_LOG) -join " | " } else { "no smoke log" }
          Write-Host "::notice::Smoke exit $($run.ExitCode): $log"
          if ($run.ExitCode -ne 0) { Write-Host "::error::App smoke test failed ($($run.ExitCode)): $log"; exit 1 }

      - name: Install and open (Mac)
        if: runner.os == 'macOS'
        run: |
          hdiutil attach dist/SCC-Presenter.dmg -nobrowse -mountpoint /Volumes/SCCP
          cp -R "/Volumes/SCCP/SCC Presenter.app" /Applications/
          hdiutil detach /Volumes/SCCP
          codesign --verify --deep --verbose=1 "/Applications/SCC Presenter.app"
          SCC_SMOKE_LOG="$RUNNER_TEMP/smoke.log" "/Applications/SCC Presenter.app/Contents/MacOS/SCC Presenter" --smoke-test || { echo "::error::Mac smoke failed: $(cat $RUNNER_TEMP/smoke.log 2>/dev/null | tr '\n' ' ')"; exit 1; }
          echo "::notice::Mac: $(cat $RUNNER_TEMP/smoke.log | tr '\n' ' ')"

      - name: Upload to release
        shell: bash
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then FILES="SCC-Presenter-Setup.exe SCC-Presenter-Setup.exe.blockmap latest.yml"; else FILES="SCC-Presenter.dmg SCC-Presenter.dmg.blockmap latest-mac.yml"; fi
          ls -la $FILES
          gh release upload "$TAG" $FILES --clobber --repo "${{ github.repository }}"

  publish:
    needs: [test, build]
    runs-on: ubuntu-latest
    env: { TAG: "${{ needs.test.outputs.tag }}" }
    steps:
      - name: Publish release
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}", GH_REPO: "${{ github.repository }}" }
        run: |
          names=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          echo "$names"
          for f in SCC-Presenter-Setup.exe latest.yml SCC-Presenter.dmg; do echo "$names" | grep -qx "$f" || { echo "Missing $f"; exit 1; }; done
          # Canary: start the new version on 10% of computers. rollout.yml widens it to 50% and then 100%
          # while nobody reports a blocking problem (an open issue labelled "release-blocker").
          mkdir -p ring && cd ring
          for f in latest.yml latest-mac.yml; do
            gh release download "$TAG" --pattern "$f" --clobber
            sed -i '/^stagingPercentage:/d' "$f" && echo "stagingPercentage: 10" >> "$f"
          done
          gh release upload "$TAG" latest.yml latest-mac.yml --clobber
          cd ..
          PRE=""; case "$TAG" in *-*|v0.*) PRE="--prerelease";; esac
          gh release edit "$TAG" --draft=false $PRE
          echo "::notice title=Canary::$TAG is out to 10% of computers. rollout.yml widens it."
