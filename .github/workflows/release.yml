name: Release
# Push a tag like v0.1.0 (matching package.json) to build the Windows installer and Mac app and publish them.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag: { description: "Existing tag to (re)build, e.g. v0.1.0", required: true }
permissions:
  contents: write
concurrency: release-${{ github.ref }}
env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.TAG }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test test/*.test.js
      - name: Version matches tag
        run: test "v$(node -p "require('./package.json').version")" = "$TAG"

  draft:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.TAG }}" }
      - name: Create draft release
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then echo "Release exists"; exit 0; fi
          gh release create "$TAG" --draft --title "SCC Presenter ${TAG#v}" --notes-file RELEASE_NOTES.md

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.TAG }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: node --test test/*.test.js
      - name: Build and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --publish always

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}", GH_REPO: "${{ github.repository }}" }
        run: |
          gh release view "$TAG" --json assets --jq '.assets[].name'
          gh release edit "$TAG" --draft=false --latest
