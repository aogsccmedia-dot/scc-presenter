<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'">
<title>SCC Remote</title>
<link rel="stylesheet" href="/web/remote.css">
</head>
<body>
<form id="login">
  <h1>SCC Remote</h1>
  <p>Type the 4-digit PIN shown under <b>Connect</b> in SCC Presenter.</p>
  <input id="pin" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="PIN" required>
  <button>Connect</button>
  <p class="err" id="err" role="alert"></p>
</form>
<div id="app" hidden>
  <header><strong id="title">Nothing selected</strong><span id="pos"></span></header>
  <ol id="slides"></ol>
  <nav>
    <button data-act="black" class="tog">Black</button>
    <button data-act="clear" class="tog">Clear</button>
    <button data-act="logo" class="tog">Logo</button>
    <button data-act="prev" class="big">‹ Back</button>
    <button data-act="next" class="big primary">Next ›</button>
  </nav>
</div>
<script type="module" src="/web/remote.js"></script>
</body>
</html>
