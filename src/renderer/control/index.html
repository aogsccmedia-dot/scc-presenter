<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; connect-src 'self'; font-src 'self' data:">
<title>SCC Presenter</title>
<link rel="stylesheet" href="/control/control.css">
</head>
<body class="booting">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6" cy="18" r="3" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="18" cy="16" r="3" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5v14zM20 17v4H6.5A2.5 2.5 0 0 1 4 18.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="8.5" cy="8.5" r="1.5" fill="currentColor"/><path d="M21 15l-5-5L5 21" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
    <symbol id="i-monitor" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 21h8M12 17v4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-stage" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M7 20h10M7 8h6M7 12h10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-wifi" viewBox="0 0 24 24"><path d="M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0M2 9a15 15 0 0 1 20 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="19.5" r="1.2" fill="currentColor"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z" fill="currentColor"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="6" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="18" cy="19" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4" stroke="currentColor" stroke-width="2"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z" fill="currentColor"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M7 4h4v16H7zM14 4h4v16h-4z" fill="currentColor"/></symbol>
    <symbol id="i-restart" viewBox="0 0 24 24"><path d="M1 4v6h6M3.5 15a9 9 0 1 0 2.1-9.4L1 10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1" fill="currentColor"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-grip" viewBox="0 0 24 24"><path d="M9 5h.01M9 12h.01M9 19h.01M15 5h.01M15 12h.01M15 19h.01" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></symbol>
    <symbol id="i-text" viewBox="0 0 24 24"><path d="M4 7V5h16v2M9 19h6M12 5v14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-volume" viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4zM15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  </defs>
</svg>

<header class="topbar">
  <div class="brand"><span class="mark">SCC</span><span class="name">Presenter</span></div>
  <div class="screens">
    <button class="pill" id="btnOutput" title="Show slides on the projector (Ctrl+Shift+O)"><svg class="ic"><use href="#i-monitor"/></svg><span>Output</span><i class="dot"></i></button>
    <button class="pill" id="btnStage" title="Stage screen for the band and speaker (Ctrl+Shift+S)"><svg class="ic"><use href="#i-stage"/></svg><span>Stage</span><i class="dot"></i></button>
  </div>
  <div class="quick" role="group" aria-label="Screen controls">
    <button class="qbtn" id="btnBlack" title="Black screen (B)"><span>Black</span><kbd>B</kbd></button>
    <button class="qbtn" id="btnClear" title="Hide text, keep background (C)"><span>Clear</span><kbd>C</kbd></button>
    <button class="qbtn" id="btnLogo" title="Show church logo (L)"><span>Logo</span><kbd>L</kbd></button>
  </div>
  <div class="actions">
    <button class="tbtn chip-setup" id="setupChip" title="Screens, speakers and this computer"><svg class="ic"><use href="#i-monitor"/></svg><span>Setup</span></button>
    <button class="tbtn beta" id="btnFeedback" title="Tell us what works and what doesn't"><span class="beta-tag">BETA</span><span>Feedback</span></button>
    <button class="tbtn" id="btnAI" title="AI helpers"><svg class="ic"><use href="#i-spark"/></svg><span>AI</span></button>
    <button class="tbtn" id="btnConnect" title="Phone remote, OBS, stage screens and file sharing"><svg class="ic"><use href="#i-wifi"/></svg><span>Connect</span></button>
    <button class="tbtn" id="btnSettings" title="Settings"><svg class="ic"><use href="#i-gear"/></svg></button>
  </div>
</header>

<div class="update-bar" id="updateBar" hidden></div>

<main class="workspace">
  <aside class="left">
    <section class="service">
      <div class="panel-head">
        <select id="showSelect" class="show-select" aria-label="Service"></select>
        <button class="icon-btn" id="btnNewShow" title="New service"><svg class="ic"><use href="#i-plus"/></svg></button>
        <button class="icon-btn" id="btnShowMenu" title="Service options"><svg class="ic"><use href="#i-share"/></svg></button>
      </div>
      <ol class="service-list" id="serviceList" aria-label="Service order"></ol>
    </section>
    <section class="library">
      <nav class="tabs" role="tablist">
        <button role="tab" data-tab="songs" class="on"><svg class="ic"><use href="#i-music"/></svg>Songs</button>
        <button role="tab" data-tab="bible"><svg class="ic"><use href="#i-book"/></svg>Bible</button>
        <button role="tab" data-tab="media"><svg class="ic"><use href="#i-image"/></svg>Media</button>
        <button role="tab" data-tab="text"><svg class="ic"><use href="#i-text"/></svg>Text</button>
      </nav>
      <div class="lib-body" id="libBody"></div>
    </section>
  </aside>

  <section class="center">
    <div class="center-head" id="centerHead"></div>
    <div class="slides" id="slides"></div>
  </section>

  <aside class="right">
    <div class="preview-block">
      <div class="preview-label"><span class="live-tag">LIVE</span><span id="liveLabel">Nothing showing</span></div>
      <div class="preview live" id="livePreview"></div>
    </div>
    <div class="preview-block">
      <div class="preview-label"><span class="next-tag">NEXT</span><span id="nextLabel"></span></div>
      <div class="preview next" id="nextPreview"></div>
    </div>
    <div class="transport" id="transport">
      <button class="tr" id="btnPrev" title="Previous slide (←)"><svg class="ic flip"><use href="#i-chev"/></svg></button>
      <button class="tr primary" id="btnNext" title="Next slide (→ or Space)"><span>Next</span><svg class="ic"><use href="#i-chev"/></svg></button>
    </div>
    <div class="media-controls" id="mediaControls" hidden></div>
    <div class="look">
      <label>Look<select id="themeSelect"></select></label>
      <label>Background<select id="bgSelect"></select></label>
    </div>
    <details class="sound" id="soundPanel" open>
      <summary>Sound &amp; music</summary>
      <label class="row-label">Speaker<select id="speakerSelect" aria-label="Speaker"></select></label>
      <label class="row-label">Sound<select id="presetSelect" aria-label="Sound preset"></select></label>
      <div class="row pad-row"><select id="padKey" aria-label="Pad key"></select><button class="btn small" id="btnPad"></button></div>
      <div class="row"><svg class="ic"><use href="#i-volume"/></svg><input type="range" id="padVol" min="0" max="1" step="0.05" value="0.6" aria-label="Pad volume"><label class="check small"><input type="checkbox" id="padBright">Bright</label></div>
    </details>
    <details class="stage-tools" open>
      <summary>Stage tools</summary>
      <div class="row"><input class="input" id="stageMsg" placeholder="Message to stage screen" maxlength="120"><button class="btn small" id="btnMsg">Send</button></div>
      <div class="row timer"><svg class="ic"><use href="#i-clock"/></svg><input class="input" id="timerMin" type="number" min="1" max="180" value="30" aria-label="Minutes"><span class="muted">min</span><button class="btn small" id="btnTimer">Start</button><button class="btn small ghost" id="btnTimerReset">Reset</button><output id="timerOut"></output></div>
    </details>
  </aside>
</main>

<div class="drop-hint" id="dropHint"><div>Drop songs, shows, images, videos or audio</div></div>
<div class="boot" id="boot"><div class="mark big">SCC</div><div class="boot-name">Presenter</div></div>

<script type="module" src="/control/control.js"></script>
</body>
</html>
